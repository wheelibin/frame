<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Home HQ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div id="clock"></div>
    <div id="date"></div>
  </header>
  <main class="widgets">
    <section class="widget widget-calendar">
      <h2><span class="widget-icon">&#128197;</span>Upcoming</h2>
      <ul id="events"><li class="empty">Loading&hellip;</li></ul>
    </section>
    <section class="widget widget-weather">
      <h2><span class="widget-icon" id="weather-icon">&#9728;</span>Weather</h2>
      <div id="weather"><p class="empty">Loading&hellip;</p></div>
      <div id="rain-alert"></div>
    </section>
    <section class="widget widget-today">
      <h2><span class="widget-icon">&#9989;</span>Today</h2>
      <div id="today-people"><p class="empty">Loading&hellip;</p></div>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="config.local.js"></script>
  <script src="app.js"></script>
</body>
</html>
