<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Home HQ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-left">
      <div id="clock"></div>
      <div id="date"></div>
    </div>
    <div id="fact">
      <div class="fact-label">Random fact of the day</div>
      <div id="fact-text"></div>
    </div>
    <div class="header-right">
      <span class="status-pill" id="bin-pill"></span>
      <!-- Text labels, not icons -- the obvious emoji here (dog U+1F415, paw U+1F43E) are
           outside the BMP, same class of issue as the shopping cart icon elsewhere in this
           project, and would render as tofu boxes on this device's font. -->
      <span class="status-pill" id="dog-fed-pill">
        <img class="paw-icon" src="paw-icon.svg" alt="">
        <span class="dog-fed-slot" id="dog-fed-morning">AM</span>
        <span class="dog-fed-slot" id="dog-fed-afternoon">PM</span>
      </span>
    </div>
  </header>
  <main class="widgets">
    <div class="controls-row">
      <span class="status-pill" id="fish-pill">Fish fed: <span id="fish-value">&hellip;</span><button class="pill-action-btn" id="fish-fed-btn" data-action="fed">Fed</button></span>
      <span class="status-pill" id="litter-pill">Litter: <span id="litter-value">&hellip;</span><button class="pill-action-btn" id="litter-scoop-btn" data-action="scoop">Scooped</button></span>
      <span class="status-pill lighting-control">
        <span class="lighting-label">Kitchen/Sunroom</span>
        <input type="range" id="kitchen-brightness" min="1" max="100" value="100">
        <button class="pill-action-btn" id="kitchen-auto-btn">Auto: &hellip;</button>
      </span>
    </div>
    <div class="row1">
      <section class="widget widget-weather">
        <h2><span class="widget-icon" id="weather-icon">&#9728;</span>Weather</h2>
        <div id="weather"><p class="empty">Loading&hellip;</p></div>
        <div class="alerts-row">
          <div id="rain-alert"></div>
          <div id="coat-alert"></div>
        </div>
      </section>
      <section class="widget widget-shopping">
        <!-- Trigram-for-heaven glyph (U+2630, same Misc Symbols block as the weather icon)
             used as a plain list icon -- the shopping cart emoji (U+1F6D2) is outside
             the BMP and didn't render on this device's font, same class of issue as the
             ticket emoji elsewhere in this project. -->
        <h2><span class="widget-icon">&#9776;</span>Shopping List</h2>
        <div class="shopping-add-row">
          <input type="text" id="shopping-input" placeholder="Add item&hellip;">
          <button id="shopping-add-btn">Add</button>
        </div>
        <ul id="shopping-items"><li class="empty">Loading&hellip;</li></ul>
      </section>
    </div>
    <div id="today-people"><p class="empty">Loading&hellip;</p></div>
  </main>
  <script src="config.js"></script>
  <script src="config.local.js"></script>
  <script src="app.js"></script>
</body>
</html>
